name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true
      - name: Generate Android project
        run: flutter create --no-pub --platforms=android --project-name=bama --org=com.ymahack .
      - name: Remove generated sample tests
        run: rm -rf test
      - name: Convert logo to PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert assets/logo.svg -o assets/logo.png -w 1024 -h 1024
      - name: Enable internet permission for OCR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perm='<uses-permission android:name="android.permission.INTERNET"/>'
          if perm not in s:
              s=s.replace('>', '>\\n    '+perm, 1)
          p.write_text(s)
          PY
      - name: Prepare Hebrew OCR model
        run: |
          mkdir -p assets/tessdata
          curl -L --fail --retry 3 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/heb.traineddata -o assets/tessdata/heb.traineddata
      - name: Get packages
        run: flutter pub get
      - name: Patch OCR plugin for current Gradle
        run: |
          OCR_DIR=$(find "$PUB_CACHE/hosted/pub.dev" -maxdepth 1 -type d -name 'tesseract_ocr-*' | sort | tail -1)
          test -n "$OCR_DIR"
          sed -i 's/jcenter()/mavenCentral()/g' "$OCR_DIR/android/build.gradle"
          sed -i "s/gradle:8.2.1/gradle:8.5.2/g" "$OCR_DIR/android/build.gradle"
      - name: Generate launcher icon
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bama-release
          path: build/app/outputs/flutter-apk/app-release.apk
