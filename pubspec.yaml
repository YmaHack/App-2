name: bama
description: "במה – ניהול רשימות שירים והצגת אקורדים להופעות"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  file_picker: ^10.3.3
  syncfusion_flutter_pdf: ^34.2.7
  flutter_svg: ^2.3.0
  flutter_tesseract_ocr: ^0.4.31
  path_provider: ^2.1.5
  pdf_renderer: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  launcher_icons: ^0.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg

launcher_icons:
  image_path: assets/logo.svg
  android:
    generate: true
    min_sdk_android: 21
